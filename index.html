<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ImmoCoco — direction : un écrin sombre et chaud, comme un hall d'hôtel la nuit.
   Noir bleuté profond, ivoire pour le texte, or champagne pour ce qui compte, verre dépoli pour les surfaces.
   Layout : application mobile, barre d'onglets flottante ; rail latéral sur grand écran. */
:root{
  --bg:#0A0E11; --bg2:#10161A; --surface:rgba(255,255,255,.045); --surface-solid:#141A1E; --surface-2:rgba(255,255,255,.07);
  --ink:#F4EEE3; --muted:#9BA4A7; --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.16);
  --gold:#D9B56E; --gold-2:#F1DCA6; --gold-3:#A9823C; --gold-soft:rgba(217,181,110,.13);
  --accent:var(--gold); --accent-ink:#1A1408; --accent-soft:var(--gold-soft);
  --teal:#7CC9CF; --teal-soft:rgba(124,201,207,.12);
  --sun:var(--gold); --sun-soft:var(--gold-soft); --sun-ink:var(--gold-2);
  --good:#74D3A0; --good-soft:rgba(116,211,160,.13); --warn:#EDBE62; --warn-soft:rgba(237,190,98,.13); --bad:#F2928A; --bad-soft:rgba(242,146,138,.14);
  --s1:#2E9BBE; --s2:#C9752A;
  --font-display:"Fraunces", "Iowan Old Style", Georgia, serif;
  --font-body:"Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:22px; --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;min-height:100%;
  background:radial-gradient(900px 500px at 85% -10%,rgba(217,181,110,.16),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(124,201,207,.08),transparent 60%),var(--bg);
  background-attachment:fixed;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--font-display);line-height:1.12;margin:0;text-wrap:balance;font-weight:500;letter-spacing:-.01em}
h1{font-size:2.15rem;font-weight:400}
h2{font-size:1.32rem}
h3{font-size:1.06rem;font-weight:600}
p{margin:0}
a{color:var(--gold)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}
.num,td.n,.tile b{font-variant-numeric:tabular-nums}
.serif{font-family:var(--font-display)}
.gold{color:var(--gold)}
.eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* Header */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 0%,rgba(10,14,17,.72) 100%);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  padding:calc(12px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 12px max(18px,env(safe-area-inset-left));display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--font-display);font-size:1.45rem;font-weight:400;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b i{font-style:italic;color:var(--gold)}
.sync{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good);box-shadow:0 0 10px var(--good)} .dot.saving{background:var(--gold);animation:pulse 1s infinite} .dot.err{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gold-2),var(--gold-3));color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:var(--font-display);font-size:1.05rem;border:0;cursor:pointer;box-shadow:0 0 0 3px rgba(217,181,110,.15)}

/* Layout */
main{max-width:760px;margin:0 auto;padding:22px max(18px,env(safe-area-inset-right)) 30px max(18px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
main.enter>*{animation:rise .55s var(--ease) both}
main.enter>*:nth-child(2){animation-delay:.04s} main.enter>*:nth-child(3){animation-delay:.08s} main.enter>*:nth-child(4){animation-delay:.12s} main.enter>*:nth-child(5){animation-delay:.16s} main.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;width:min(94vw,520px);
  background:rgba(20,26,30,.78);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--line-strong);border-radius:26px;
  display:grid;grid-template-columns:repeat(5,1fr);padding:7px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;border-radius:19px;text-decoration:none;color:var(--muted);font-size:.66rem;font-weight:700;letter-spacing:.02em;transition:color .25s,background .25s}
nav.tabs a svg{width:22px;height:22px;transition:transform .3s var(--ease)}
nav.tabs a[aria-current="page"]{color:var(--gold);background:var(--gold-soft)}
nav.tabs a[aria-current="page"] svg{transform:translateY(-1px) scale(1.08);filter:drop-shadow(0 0 8px rgba(217,181,110,.55))}
@media (min-width:980px){
  body{padding-bottom:0}
  .shell{display:grid;grid-template-columns:230px 1fr}
  nav.tabs{position:sticky;left:auto;transform:none;top:86px;bottom:auto;margin:20px 0 0 18px;width:auto;height:max-content;display:flex;flex-direction:column;gap:4px;border-radius:24px}
  nav.tabs a{flex-direction:row;gap:12px;font-size:.92rem;padding:12px 14px}
}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card.flat{background:transparent}
.card.sun,.card.gold{background:linear-gradient(140deg,rgba(217,181,110,.2),rgba(217,181,110,.05) 60%);border-color:rgba(217,181,110,.35)}
.card.accent{background:linear-gradient(150deg,#2A2213 0%,#16130C 55%,#0F1316 100%);border-color:rgba(217,181,110,.4);overflow:hidden}
.card.accent::after{content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;background:radial-gradient(circle,rgba(241,220,166,.22),transparent 65%);pointer-events:none}
.card.accent .muted{color:rgba(244,238,227,.7)}
a.card{transition:transform .25s var(--ease),border-color .25s}
a.card:hover{transform:translateY(-2px);border-color:var(--line-strong)}
.hero{border-radius:28px;padding:24px 22px;background:linear-gradient(155deg,#2B2314 0%,#15120C 45%,#0E1418 100%);border:1px solid rgba(217,181,110,.35);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:16px}
.hero::before{content:"";position:absolute;width:420px;height:420px;right:-160px;top:-200px;background:conic-gradient(from 200deg,transparent,rgba(241,220,166,.28),transparent 40%);filter:blur(30px);animation:spin 18s linear infinite;pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.06) 45%,transparent 60%);transform:translateX(-100%);animation:sheen 6s 1s ease-in-out infinite;pointer-events:none}
.hero>*{position:relative;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sheen{0%{transform:translateX(-100%)}40%,100%{transform:translateX(100%)}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.small{font-size:.87rem}
.tiny{font-size:.75rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:400px){.grid2,.grid3{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tiles.three{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile span{font-size:.68rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.tile b{font-family:var(--font-display);font-size:1.45rem;font-weight:400;white-space:nowrap}
.tile em{font-style:normal;font-size:.68rem;color:var(--gold);opacity:.8}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.25);min-height:46px;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.field select option{background:#141A1E;color:#F4EEE3}
.field select{color:var(--ink);-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.field textarea{min-height:110px;resize:vertical;line-height:1.5}
.field .hint{font-size:.74rem;color:var(--muted)}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.8)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:999px;border:1px solid transparent;
  background:linear-gradient(135deg,var(--gold-2),var(--gold) 45%,var(--gold-3));color:var(--accent-ink);font-weight:800;cursor:pointer;text-decoration:none;min-height:46px;
  box-shadow:0 8px 24px rgba(217,181,110,.22),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .15s var(--ease),box-shadow .2s,opacity .2s;letter-spacing:.01em;position:relative;overflow:hidden}
.btn:active{transform:scale(.96)}
.btn:hover{box-shadow:0 10px 30px rgba(217,181,110,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong);box-shadow:none}
.btn.soft,.btn.sunb.soft{background:var(--surface-2);color:var(--ink);border-color:var(--line);box-shadow:none}
.btn.sunb{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--accent-ink)}
.btn.danger{background:transparent;border-color:rgba(242,146,138,.4);color:var(--bad);box-shadow:none}
.btn.sm{padding:7px 13px;min-height:36px;font-size:.82rem}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.cta{min-height:58px;font-size:1.02rem;border-radius:20px;width:100%}

.subtabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 15px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--muted);transition:all .25s var(--ease)}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.68rem;font-weight:800;white-space:nowrap;letter-spacing:.06em;text-transform:uppercase}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--teal-soft);color:var(--teal)}
.pill.neutral{background:var(--surface-2);color:var(--muted)} .pill.sun{background:var(--gold-soft);color:var(--gold)}
button.pill{border:1px solid transparent;cursor:pointer;padding:7px 13px;transition:all .2s}
button.pill.neutral{border-color:var(--line)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:2px}
.li .grow{flex:1;min-width:0}
button.li{background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit}
.check{width:26px;height:26px;flex:none;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;background:transparent;cursor:pointer;padding:0;transition:all .25s var(--ease)}
.check.on{background:linear-gradient(135deg,var(--gold-2),var(--gold-3));border-color:transparent;color:var(--accent-ink);transform:scale(1.04)}
.check svg{width:14px;height:14px}
details.why{border-top:1px solid var(--line);padding-top:12px}
details.why summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:.85rem;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:6px}
details.why summary::-webkit-details-marker{display:none}
details.why summary::after{content:"";width:8px;height:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);transition:transform .25s;margin-right:4px}
details.why[open] summary::after{transform:rotate(-135deg)}
details.why[open] summary{margin-bottom:10px;color:var(--ink)}
details.why>div{font-size:.9rem;display:flex;flex-direction:column;gap:6px;color:rgba(244,238,227,.85)}
details.why ul,details.why ol{margin:0;padding-left:20px}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-3),var(--gold-2));border-radius:99px;box-shadow:0 0 12px rgba(241,220,166,.6);animation:grow 1s var(--ease) both}
@keyframes grow{from{width:0}}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--gold-soft);color:var(--gold-2);font-size:.88rem;border:1px solid rgba(217,181,110,.25)}
.banner.bad{background:var(--bad-soft);color:var(--bad);border-color:rgba(242,146,138,.3)}
.banner.info{background:var(--teal-soft);color:var(--ink);border-color:rgba(124,201,207,.25)}
.demo-bar{position:sticky;top:calc(63px + env(safe-area-inset-top));z-index:19;margin:0;border-radius:0;justify-content:center;align-items:center;background:linear-gradient(90deg,#3A2E15,#20190C);border:0;border-bottom:1px solid rgba(217,181,110,.35)}
.cmp td,.cmp th{white-space:normal!important;padding:8px 6px;word-break:normal}.cmp td:first-child,.cmp th:first-child{width:30%;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:700;color:var(--muted);background:rgba(255,255,255,.03);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:560px){.months{grid-template-columns:repeat(4,1fr)}}
.month{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;transition:transform .15s var(--ease)}
.month:active{transform:scale(.96)}
.month b{font-family:var(--font-display);font-weight:500;font-size:1.05rem;text-transform:capitalize}
.month.paye{border-color:rgba(116,211,160,.45);background:var(--good-soft)}
.month.retard{border-color:rgba(242,146,138,.5);background:var(--bad-soft)}
.month.attente{border-style:dashed}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.photos figure{margin:0;position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--surface-2)}
.photos img,.photos video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s var(--ease)}
.photos figure:hover img{transform:scale(1.05)}
.photos button{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;backdrop-filter:blur(4px)}
.doc{font-family:Georgia,"Times New Roman",serif;background:#FBF8F2;color:#1A1A1A;border-radius:14px;padding:26px 22px;font-size:.92rem;line-height:1.6;max-height:540px;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.doc h4{font-family:inherit;font-size:1rem;margin:16px 0 6px;font-weight:700}
.doc h3{font-family:inherit;text-align:center;font-size:1.15rem;margin-bottom:10px;font-weight:700}
.doc th{background:#EEE8DC;color:#444} .doc td,.doc th{border-bottom:1px solid #DDD5C6}

.score{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:1.35rem;flex:none;border:2px solid;position:relative}
.score.good{border-color:var(--good);color:var(--good);box-shadow:0 0 18px rgba(116,211,160,.25)} .score.warn{border-color:var(--warn);color:var(--warn)} .score.bad{border-color:var(--bad);color:var(--bad)}

.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(4,6,8,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s both}
.sheet .panel{background:var(--surface-solid);border:1px solid var(--line-strong);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .4s var(--ease) both}
.sheet .panel::before{content:"";align-self:center;width:42px;height:5px;border-radius:9px;background:var(--line-strong);margin-bottom:4px}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(40px);opacity:0}}
@media (min-width:700px){.sheet{align-items:center}.sheet .panel{border-radius:28px}}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.78rem;padding:7px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 14px;font-size:.92rem}
.kv span:nth-child(even){text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:18px;font-size:.9rem}
.timeline .li .date{min-width:76px;font-weight:700;font-size:.76rem;color:var(--gold);letter-spacing:.04em;text-transform:uppercase;padding-top:2px}
.folders{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.folders{grid-template-columns:repeat(3,1fr)}}
.folder{position:relative;text-align:left;cursor:pointer;border:1px solid var(--line);border-radius:20px;padding:16px 14px 14px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));color:inherit;display:flex;flex-direction:column;gap:10px;transition:transform .2s var(--ease),border-color .2s}
.folder:hover{border-color:rgba(217,181,110,.4)} .folder:active{transform:scale(.97)}
.folder .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
.folder .ic svg{width:22px;height:22px}
.folder b{font-family:var(--font-display);font-weight:500;font-size:1.08rem}
.folder small{color:var(--muted);font-size:.75rem}
.folder .miss{position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px var(--warn)}
#lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(16px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom));animation:fade .2s both}
#lightbox img{max-width:100%;max-height:calc(100% - 90px);object-fit:contain;border-radius:12px}
#lightbox .row{justify-content:center}
.sigpad{width:100%;aspect-ratio:600/220;height:auto;background:#fff;border-radius:16px;touch-action:none;display:block;border:1px solid var(--line-strong);cursor:crosshair}
.sigpad.done{display:grid;place-items:center;padding:6px}.sigpad.done img{max-height:100%;max-width:100%}
.ring{width:64px;height:64px;flex:none}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:rgba(255,255,255,.1)} .ring .fg{stroke:url(#gGold);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;animation:ringIn 1.2s var(--ease) both}
@keyframes ringIn{from{stroke-dashoffset:var(--full)}}
.steps .step{display:flex;gap:14px;position:relative;padding-bottom:18px}
.steps .step:not(:last-child)::before{content:"";position:absolute;left:12px;top:30px;bottom:0;width:1.5px;background:var(--line-strong)}
.steps .step.done:not(:last-child)::before{background:linear-gradient(var(--gold),var(--gold-3))}
.steps .when{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.steps .when.late{color:var(--bad)}
.thumb{width:52px;height:52px;object-fit:cover;border-radius:12px;flex:none;background:var(--surface-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const dirty=new Set(); let saveT=null, saving=false;
function touch(sec){

  dirty.add(sec); try{localStorage.setItem("ct_cache",JSON.stringify({...S,_v:DATA_V}))}catch(e){}
  clearTimeout(saveT); saveT=setTimeout(flush,700); setSync("saving");
}
async function flush(){
  if(!DB){setSync(window.claude?"local":"local");return}
  if(saving)return; saving=true;
  try{
    while(dirty.size){const sec=[...dirty][0];dirty.delete(sec);await DB.doc("app/"+sec).set(JSON.parse(JSON.stringify(S[sec])))}
    setSync("ok");
  }catch(e){
    if(e&&e.code==="invalid_argument"){readOnly=true;setSync("ro")}
    else if(e&&e.code==="quota_exceeded"){setSync("err");toast("Espace de stockage plein : supprime des éléments.")}
    else {setSync("err");setTimeout(()=>{saving=false;flush()},2500);return}
  }
  saving=false;
}

  if(s==="ok"){d.classList.add("ok");t.textContent="Enregistré"}

}

  return {mens:m,mensTot:m+N(c.assuranceMois),years,coutTotal:m*n-P+N(c.assuranceMois)*n};
}
function irCalc(rev,parts){parts=Math.max(1,N(parts));const q=Math.max(0,rev)/parts;let t=0,prev=0;for(const [lim,tx] of REF.bareme2026){if(q>prev)t+=(Math.min(q,lim)-prev)*tx;prev=lim}t*=parts;const [plaf,base]=parts>=2?[3277,1483]:[1982,897];if(t<plaf)t=Math.max(0,t-Math.max(0,base-.4525*t));return t}

function recettes(){return (N(S.bail.loyerHC)+N(S.bail.charges))*N(S.fiscal.moisLoues)}
function abatIR(n){if(n<6)return 0;if(n>=22)return 1;return (n-5)*.06}
function abatPS(n){if(n<6)return 0;if(n>=30)return 1;if(n<=21)return (n-5)*.0165;if(n===22)return 16*.0165+.016;return Math.min(1,16*.0165+.016+(n-22)*.09)}
function projection(opt={}){
  const b=S.bien,f=S.fiscal,cr=creditCalc();const R=recettes();const H=Math.max(1,Math.min(30,N(f.horizon)));
  const base=(N(b.prix)+N(b.fraisNotaire)+N(b.fraisAgence))*(1-N(b.partTerrainPct)/100);
  const aBati=base/30,aMob=N(b.valeurMobilier)/7,aTrav=N(b.travauxTotal)/15;
  const fixes=N(b.taxeFonciere)+N(b.pno)+N(b.gli)+N(f.compta)+N(f.entretien)+N(f.cfe)+N(f.chargesReelles)+N(S.credit.assuranceMois)*12;
  const sal=N(f.revenuImposable),parts=f.parts;
  let def=0,stock=0,usedCum=0,cumM=0,cumR=0;const rows=[];
  const taxMicroBase=R*REF.microAbatt;const taxMicro=irCalc(sal+taxMicroBase,parts)-irCalc(sal,parts)+taxMicroBase*REF.psBIC;
  for(let y=1;y<=H;y++){
    const avail=opt.plf?Math.min(base*.025+(y<=7?aMob:0)+(y<=15?aTrav:0),7000):(y<=30?aBati:0)+(y<=7?aMob:0)+(y<=15?aTrav:0);
    const ints=cr.years[y-1]?cr.years[y-1].interets:0;
    const charges=fixes+ints+(y===1?N(b.fraisPret):0);
    let res=R-charges-def; if(res<0){def=-res;res=0}else def=0;
    if(opt.plf)stock=0;stock+=avail;const used=Math.min(stock,res);stock-=used;if(opt.plf)stock=0;usedCum+=used;
    const imposable=res-used;
    const taxR=irCalc(sal+imposable,parts)-irCalc(sal,parts)+imposable*REF.psBIC;

    rows.push({y,R,charges,ints,avail,used,imposable,taxR,taxM:taxMicro,cumM,cumR,stock,def});

  return {R,H,rows,aBati,aMob,aTrav,fixes,taxMicro,taxMicroBase,usedCum,extraPV,totM:cumM,totR:cumR,totRPV:cumR+extraPV,tmi:tmi(sal,parts),an1:rows[0]};
}
function cashflow(){const cr=creditCalc(),p=projection();const best=Math.min(p.taxMicro,p.an1?p.an1.taxR:p.taxMicro);
  const m=(N(S.bail.loyerHC)+N(S.bail.charges))*N(S.fiscal.moisLoues)/12-cr.mensTot-(N(S.bien.taxeFonciere)+N(S.bien.pno)+N(S.bien.gli)+N(S.fiscal.chargesReelles)+N(S.fiscal.entretien)+N(S.fiscal.compta)+N(S.fiscal.cfe))/12-best/12;

function moisBail(){ // 12 mois à partir du début de bail (ou du mois courant)
  const start=S.bail.debut?new Date(S.bail.debut+"T12:00:00"):new Date();const out=[];
  const now=new Date();let y=start.getFullYear(),m=start.getMonth();
  // fenêtre : du début du bail jusqu'à 12 mois, glissante si le bail a plus d'un an
  const diff=(now.getFullYear()-y)*12+(now.getMonth()-m);if(diff>9){const sh=diff-9;m+=sh;y+=Math.floor(m/12);m=((m%12)+12)%12}
  for(let i=0;i<12;i++){const mm=(m+i)%12,yy=y+Math.floor((m+i)/12);out.push(yy+"-"+String(mm+1).padStart(2,"0"))}

    if(d<st)d=new Date(st.getFullYear(),st.getMonth()+(st.getDate()>jp?1:0),jp);

    let ann=new Date(st.getFullYear()+1,st.getMonth(),st.getDate());while(ann<now)ann=new Date(ann.getFullYear()+1,st.getMonth(),st.getDate());

  }else add(today(),"Terminer la mise en route","Documents, photos des meubles, assurance : à faire une seule fois.","demarrage");

function quittanceText(k){const [y,m]=k.split("-");const b=S.bail,p=S.loyers.paiements[k]||{};const last=new Date(N(y),N(m),0).getDate();
  return `QUITTANCE DE LOYER — ${MOIS[N(m)-1]} ${y}\n\nJe soussigné ${S.profil.prenom} ${S.profil.nom}, propriétaire du logement situé ${S.bien.adresse||""}, ${S.bien.cp} ${S.bien.ville}, déclare avoir reçu de ${b.locPrenom} ${b.locNom} la somme de ${eur(N(b.loyerHC)+N(b.charges),2)} pour la période du 1er au ${last} ${MOIS[N(m)-1]} ${y}, et lui en donne quittance, sous réserve de tous mes droits.\n\nLoyer hors charges : ${eur(N(b.loyerHC),2)}\nCharges : ${eur(N(b.charges),2)}\nTotal : ${eur(N(b.loyerHC)+N(b.charges),2)}\nPaiement reçu le ${fdate(p.date)}.\n\nFait à ${S.bien.ville}, le ${fdate(today())}.\n${S.profil.prenom} ${S.profil.nom}`}
function scoreCand(c){
  const loyerCC=N(S.bail.loyerHC)+N(S.bail.charges)||1;const rev=N(c.revenus)+N(c.autresRevenus);const ratio=rev/loyerCC;const rav=rev-loyerCC;
  const flags=(c.analyse?.points||[]).length;const plus=[],moins=[],manque=[];
  // 1. Solvabilité /35
  let a=ratio>=3?25:ratio>=2.5?18:ratio>=2.2?10:0;a+=rav>=1000?10:rav>=700?6:rav>=500?3:0;
  if(!rev)manque.push("ses revenus (fiches de paie)");else if(ratio>=3)plus.push(`Revenus solides : ${ratio.toFixed(1).replace(".",",")} fois le loyer`);else moins.push(`Revenus justes : ${ratio.toFixed(1).replace(".",",")} fois le loyer (objectif 3)`);
  if(rev&&rav<700)moins.push(`Il lui reste seulement ${eur(rav)} par mois après le loyer`);
  // 2. Emploi /20
  const baseE={cdi:14,fonct:16,retraite:14,cdiessai:8,indep:8,cdd:5,etudiant:3,autre:2}[c.situation]??2;const anc=N(c.anciennete);let b=Math.min(20,baseE+(anc>=24?6:anc>=12?4:anc>=6?2:0));
  if(["cdi","fonct","retraite"].includes(c.situation))plus.push((SITUATIONS[c.situation]||[])[0]+(anc?` depuis ${anc>=12?Math.floor(anc/12)+" an"+(anc>=24?"s":""):anc+" mois"}`:""));
  else if(c.situation==="cdiessai")moins.push("Période d'essai en cours"+(c.essaiFin?` jusqu'au ${fdate(c.essaiFin)}`:""));
  else if(c.situation==="cdd")moins.push("Contrat court (CDD ou intérim)");
  if(!c.employeur)manque.push("le nom de son employeur");
  // 3. Garantie /15
  let g=0;if(c.garant==="visale"){g=15;plus.push("Garantie Visale : impayés couverts")}else if(c.garant==="physique"){g=N(c.revenusGarant)>=3*loyerCC?15:8;(g===15?plus:moins).push(`Garant à ${eur(N(c.revenusGarant))}/mois`)}else{g=ratio>=3.5&&["cdi","fonct","retraite"].includes(c.situation)?8:0;if(!g)moins.push("Aucune garantie (ni Visale ni garant)")}
  // 4. Dossier & authenticité /10
  const nbP=PIECES_OK.filter(([k])=>c.pieces?.[k]).length;let d=Math.round(nbP/PIECES_OK.length*6)+(c.analyse?(flags===0?4:flags===1?2:0):2);
  if(nbP<PIECES_OK.length)manque.push(PIECES_OK.filter(([k])=>!c.pieces?.[k]).map(([,l])=>l.split(" (")[0].toLowerCase()).join(", "));
  if(c.avis2d?.ok){const ch=checksAvis(c,c.avis2d);if(ch.every(x=>x[0])){d=Math.min(10,d+2);plus.push("Avis d'impôt authentifié par son code officiel")}else{d=Math.max(0,d-4);ch.filter(x=>!x[0]).forEach(x=>moins.push("Avis d'impôt : "+x[1]))}}else if(c.avis2d&&!c.avis2d.ok){manque.push("une photo nette de son avis d'impôt (code illisible)")}else manque.push("le scan du code de son avis d'impôt");
  if(c.analyse&&flags){const keys=["essai","revenu","avis","garant","domicile","cdd","identit"];c.analyse.points.slice(0,4).forEach(pt=>{const l=pt.toLowerCase();if(!moins.some(m=>keys.some(k=>l.includes(k)&&m.toLowerCase().includes(k))))moins.push(pt)})}
  // 5. Parcours locatif /10
  let pl={positive:6,neutre:3,negative:0,non:2,"":1}[c.refBailleur||""]??1;pl+=c.quittancesAJour==="oui"?4:c.quittancesAJour==="non"?0:1;
  if(c.refBailleur==="positive")plus.push("Ancien propriétaire : bons retours");if(c.refBailleur==="negative")moins.push("Ancien propriétaire : retours négatifs");
  if(c.quittancesAJour==="non")moins.push("Retards de loyer dans son logement actuel");if(!c.refBailleur||c.refBailleur==="non")manque.push("un appel à son propriétaire actuel");
  // 6. Projet & visite /10
  let v=(c.duree==="long"?3:c.duree==="moyen"?2:c.duree==="court"?0:1)+(c.ponctuel?1:0)+(c.soigneux?1:0)+(c.interesse?1:0)+Math.max(0,N(c.feeling)-1);
  v=Math.min(10,v);if(c.duree==="long")plus.push("Veut rester plus de 2 ans");if(c.duree==="court")moins.push("Prévoit de rester moins d'un an");
  if(!c.motif)manque.push("pourquoi il déménage");
  const cats=[["Solvabilité",a,35],["Emploi",b,20],["Garantie",g,15],["Dossier",d,10],["Parcours locatif",pl,10],["Entretien & visite",v,10]];
  const s=Math.round(cats.reduce((t,x)=>t+x[1],0));
  const cls=s>=75?"good":s>=55?"warn":"bad";
  const verdict=s>=75?"Je le prendrais":s>=55?"Possible, à compléter":"Je ne le prendrais pas";
  return {s,cats,ratio,rav,plus,moins,manque:manque.filter(Boolean),cls,verdict,det:cats.map(([l,x,m])=>[l,Math.round(x),m])};
}
const QUESTIONS=[["motif","Pourquoi déménagez-vous ?","text","ex. rapprochement du travail"],["entree","Quand souhaitez-vous entrer ?","date",""],["occupants","Combien de personnes vivront dans la maison ?","num",""],["duree","Combien de temps pensez-vous rester ?","select",[["","—"],["court","Moins d'un an"],["moyen","1 à 2 ans"],["long","Plus de 2 ans"]]],["logement","Où vivez-vous aujourd'hui ?","select",[["","—"],["locataire","Locataire"],["heberge","Hébergé (famille, amis)"],["proprio","Propriétaire"],["autre","Autre"]]],["quittancesAJour","Êtes-vous à jour de vos loyers ?","select",[["","—"],["oui","Oui (quittances fournies)"],["non","Non"]]],["refBailleur","Appel à son propriétaire actuel","select",[["","Pas encore appelé"],["positive","Retours positifs"],["neutre","Retours neutres"],["negative","Retours négatifs"],["non","Impossible à joindre"]]]];
function bar(x,m){return `<div class="progress" style="height:5px"><i style="width:${Math.round(x/m*100)}%;${x/m<.5?"background:var(--bad);box-shadow:none":x/m<.75?"background:var(--warn);box-shadow:none":""}"></i></div>`}

function lightbox(path,i){const arr=getPath(path)||[];const n=arr.length;if(!n)return;i=((N(i)%n)+n)%n;const ph=arr[i];UI.lb={path,i};
  const el=$("#lightbox");el.hidden=false;el.innerHTML=`<img src="${esc(assetUrl(ph))}" alt="${esc(ph.nom||"photo")}"><p class="tiny muted">${i+1} / ${n}</p>
  <div class="row">${n>1?`<button class="btn sm ghost" data-act="lbGo" data-arg="${i-1}" aria-label="Précédente">‹</button>`:""}<button class="btn sm" data-act="dlPhoto" data-path="${path}" data-arg="${i}" ${DL?"":"disabled"}>Télécharger</button><button class="btn sm ghost" data-act="lbClose">Fermer</button>${n>1?`<button class="btn sm ghost" data-act="lbGo" data-arg="${i+1}" aria-label="Suivante">›</button>`:""}</div>`}
async function dlPhoto(path,i){const ph=(getPath(path)||[])[N(i)];if(!ph||!DL){toast("Téléchargement indisponible ici");return}
  try{const b=await (await fetch(assetUrl(ph))).blob();const ext=(ph.nom||"").match(/\.[a-z0-9]+$/i)?.[0]||".jpg";await DL.save({filename:safeName((ph.nom||"photo").replace(/\.[a-z0-9]+$/i,""))+ext,data:b});toast("Photo téléchargée")}catch(e){toast("Téléchargement impossible")}}
async function dlAllPhotos(path){const arr=getPath(path)||[];if(!arr.length||!DL)return;toast("Préparation…");
  try{const Z=await loadJSZip();const zip=new Z();let k=1;for(const ph of arr){try{const b=await (await fetch(assetUrl(ph))).blob();const ext=(ph.nom||"").match(/\.[a-z0-9]+$/i)?.[0]||".jpg";zip.file(String(k).padStart(2,"0")+" "+safeName((ph.nom||"photo").replace(/\.[a-z0-9]+$/i,""))+ext,b);k++}catch(_){}}
  await DL.save({filename:"Photos_maison.zip",data:await zip.generateAsync({type:"blob"})});toast("Photos téléchargées")}catch(e){toast("Téléchargement impossible")}}

function cautionHTML(){const b=S.bail,bi=S.bien,pr=S.profil,g=b.caution||{};const L=x=>esc(x||"…………………");
  const loyer=N(b.loyerHC)+N(b.charges);const ans=N(g.annees)||3;const plafond=Math.round(loyer*12*ans*1.1);
  const fin=(()=>{if(!b.debut)return "……………";const d=new Date(b.debut+"T12:00:00");d.setFullYear(d.getFullYear()+ans);d.setDate(d.getDate()-1);return fdate(d.toISOString().slice(0,10))})();
  return `<h3>ACTE DE CAUTIONNEMENT SOLIDAIRE<br>Location d'un logement meublé</h3>
<p style="text-align:center;font-size:.85em">Article 22-1 de la loi n° 89-462 du 6 juillet 1989 · articles 2288 et suivants du Code civil</p>
<h4>1. Les parties</h4>
<p><b>La caution :</b> ${L(((g.prenom||"")+" "+(g.nom||"")).trim())}${g.naissance?", né(e) le "+fdate(g.naissance):""}${g.lieuNaissance?" à "+esc(g.lieuNaissance):""}, demeurant ${L(g.adresse)}${g.email?", e-mail : "+esc(g.email):""}${g.tel?", tél. : "+esc(g.tel):""}.</p>
<p><b>Le bailleur (bénéficiaire) :</b> ${L(pr.prenom+" "+pr.nom)}, demeurant ${L(pr.adresse)}.</p>
<p><b>Le locataire (débiteur garanti) :</b> ${L(((b.locPrenom||"")+" "+(b.locNom||"")).trim())}.</p>
<h4>2. Le bail garanti</h4>
<p>Contrat de location meublée du logement situé ${L(bi.adresse)}, ${esc(bi.cp)} ${esc(bi.ville)}, prenant effet le ${fdate(b.debut)}, pour une durée d'un an reconductible. Un exemplaire du contrat de location est remis à la caution, qui le reconnaît.</p>
<p><b>Montant du loyer :</b> ${eur(N(b.loyerHC),2)} par mois${N(b.charges)?", plus "+eur(N(b.charges),2)+" de charges":", sans charges"}, payable le ${N(b.jourPaiement)} de chaque mois.</p>
<p><b>Conditions de révision :</b> le loyer est révisé chaque année à la date anniversaire du bail selon la variation de l'indice de référence des loyers (IRL) publié par l'Insee, trimestre de référence ${esc(b.irlTrim)} (valeur ${String(b.irlVal).replace(".",",")}).</p>
<h4>3. L'engagement de la caution</h4>
<p>La caution se porte <b>caution solidaire</b> du locataire envers le bailleur pour le paiement des loyers, des charges éventuelles, des révisions de loyer, des réparations locatives, des indemnités d'occupation, ainsi que des frais de procédure éventuels, résultant du bail désigné ci-dessus.</p>

<p><b>Durée :</b> l'engagement est donné pour la durée du bail initial et de ses reconductions, jusqu'au <b>${fin}</b> (${ans} ans). Il ne peut pas être résilié avant ce terme.</p>
<p><b>Montant maximum :</b> l'engagement est limité à <b>${eur(plafond)}</b>, soit ${ans} années de loyer augmentées de 10 % pour tenir compte des révisions et des réparations locatives.</p>
<h4>4. Reproduction de l'avant-dernier alinéa de l'article 22-1 de la loi du 6 juillet 1989</h4>
<p style="font-style:italic">« Lorsque le cautionnement d'obligations résultant d'un contrat de location conclu en application du présent titre ne comporte aucune indication de durée ou lorsque la durée du cautionnement est stipulée indéterminée, la caution peut le résilier unilatéralement. La résiliation prend effet au terme du contrat de location, qu'il s'agisse du contrat initial ou d'un contrat reconduit ou renouvelé, au cours duquel le bailleur reçoit notification de la résiliation. »</p>
<h4>5. Mention de la caution</h4>
<p>« Je reconnais avoir pleinement connaissance de la nature et de l'étendue de mon engagement : en me portant caution solidaire de ${L(((b.locPrenom||"")+" "+(b.locNom||"")).trim())}, je m'engage à payer au bailleur, à la place du locataire et sans qu'il ait à le poursuivre d'abord, les sommes dues au titre du bail, dans la limite de ${eur(plafond)} et jusqu'au ${fin}. J'ai reçu un exemplaire du contrat de location. »</p>
<p style="margin-top:20px">Fait à ${esc(bi.ville)}, le ……………, en trois exemplaires (caution, bailleur, locataire).</p>

function initPads(){document.querySelectorAll("canvas.sigpad").forEach(cv=>{if(cv._init)return;cv._init=true;const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);ctx.strokeStyle="#14213D";ctx.lineWidth=3.2;ctx.lineCap="round";ctx.lineJoin="round";cv._drawn=false;
  let last=null;const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*cv.width,(e.clientY-r.top)/r.height*cv.height]};
  cv.addEventListener("pointerdown",e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);last=pos(e);cv._drawn=true});
  cv.addEventListener("pointermove",e=>{if(!last)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p});
  const end=()=>{last=null};cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end)})}
function padData(id){const cv=document.getElementById(id);if(!cv||!cv._drawn)return null;return cv.toDataURL("image/png")}

async function readDataMatrix(blob){
  // 1. Lecteur natif du téléphone quand il existe (Android/Chrome)
  try{if("BarcodeDetector" in window){const fm=await BarcodeDetector.getSupportedFormats();if(fm.includes("data_matrix")){const bmp=await createImageBitmap(blob);const r=await new BarcodeDetector({formats:["data_matrix"]}).detect(bmp);const hit=r.find(x=>(x.rawValue||"").startsWith("DC"));if(hit)return hit.rawValue}}}catch(_){}
  // 2. Lecteur intégré : on balaie l'image par zones (le code est cherché au centre de chaque zone)
  const Z=await loadZX();const url=URL.createObjectURL(blob);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const W=img.naturalWidth,H=img.naturalHeight;
    const hints=new Map();hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.DATA_MATRIX]);hints.set(Z.DecodeHintType.TRY_HARDER,true);
    const zones=[[0,0,1,1]];
    for(const sz of [0.34,0.5,0.25,0.7]){const st=sz/2;for(let y=0;y<=1-sz+1e-6;y+=st)for(let x=0;x<=1-sz+1e-6;x+=st)zones.push([x,y,sz,sz*W/H>1?sz:sz])}
    zones.sort((a,b)=>a[1]-b[1]);
    const t0=performance.now();
    for(const [x,y,w,h0] of zones){if(performance.now()-t0>12000)break;
      const sw=W*w,sh=Math.min(H*(1-y),W*w*1.1);const k=Math.min(1,900/Math.max(sw,sh));const cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(sw*k));cv.height=Math.max(1,Math.round(sh*k));
      const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,W*x,H*y,sw,sh,0,0,cv.width,cv.height);
      try{const src=new Z.HTMLCanvasElementLuminanceSource(cv);const bmp=new Z.BinaryBitmap(new Z.HybridBinarizer(src));const r=new Z.MultiFormatReader();r.setHints(hints);const txt=r.decode(bmp).getText();if(txt&&txt.startsWith("DC"))return txt}catch(_){}
      await new Promise(r=>setTimeout(r,0));
    }
    return null;
  }finally{URL.revokeObjectURL(url)}
}

    if(DD_FIXED[id]){val=t.slice(i,i+DD_FIXED[id]);i+=DD_FIXED[id]}else{let j=i;while(j<t.length&&t[j]!=="\x1d"&&t[j]!=="\x1f")j++;val=t.slice(i,j);i=j}

<p><b>E. Accès aux technologies de l'information :</b> le locataire souscrit lui-même l'abonnement internet de son choix.</p>
<p><b>F. Mobilier :</b> le logement est loué meublé et comporte au minimum les éléments exigés par le décret n° 2015-981 du 31 juillet 2015, décrits dans l'inventaire annexé${inv.length?" ("+inv.length+" éléments)":""}.</p>

<p><b>Congé du locataire :</b> à tout moment, avec un préavis d'un mois, par lettre recommandée avec accusé de réception, acte de commissaire de justice ou remise en main propre contre récépissé. Le préavis court à compter de la réception de la lettre ; le loyer reste dû jusqu'à la fin du préavis.</p>
<p><b>Congé du bailleur :</b> au moins trois mois avant le terme du contrat, dans les mêmes formes, motivé soit par la reprise du logement pour l'habiter lui-même ou y loger un proche autorisé par la loi, soit par la vente du logement, soit par un motif légitime et sérieux, notamment l'inexécution par le locataire de l'une de ses obligations.</p>

<p><b>C. Modalités de paiement :</b> ${eur(tot,2)} par mois, payable d'avance, au plus tard le <b>${N(b.jourPaiement)}</b> de chaque mois, par virement${pr.iban?" sur le compte "+esc(pr.iban):" sur le compte indiqué par le bailleur"}. Le premier loyer est dû à la remise des clés, calculé au prorata si l'entrée a lieu en cours de mois. Une quittance est remise gratuitement chaque mois après paiement.</p>

<p><b>8. Détecteur de fumée.</b> Le logement est équipé d'un détecteur de fumée normalisé. Le locataire en vérifie le fonctionnement et en remplace la pile si besoin.</p>

<p><b>10. Départ.</b> À la fin du contrat, le locataire rend le logement propre et vidé de ses effets personnels, et restitue toutes les clés et badges remis. Un état des lieux de sortie est établi contradictoirement ; à défaut d'accord, par un commissaire de justice, à frais partagés.</p>

  st.push(["cfe","Déclaration initiale de CFE (1447-C)",`${Y}-12-31`,`<p>Sur ton <b>espace professionnel impots.gouv.fr</b> (tu le crées avec ton SIRET), ou par courrier à ton service des impôts des entreprises. La CFE est exonérée l'année du début.</p>`]);

    st.push(["decl","Déclarer tes revenus (2042-C-PRO)",`${Y1}-05-25`,`<p>Dans ta déclaration en ligne, coche les revenus non salariés, puis « location meublée non professionnelle, régime réel » : report du résultat en <b>case 5NA</b> (bénéfice) ou <b>5NY</b> (déficit), avec ton SIRET. Date indicative : vérifie celle des Bouches-du-Rhône au printemps.</p>`]);
  }else{

  }

function chartCumul(p){
  const W=640,H=300,pl=70,pr=130,pt=16,pb=36;const rows=p.rows;const n=rows.length;
  const max=Math.max(1,...rows.map(r=>Math.max(r.cumM,r.cumR)),p.totRPV);const x=i=>pl+(n<=1?0:i/(n-1))*(W-pl-pr);const y=v=>pt+(1-v/max)*(H-pt-pb);
  const ticks=[0,.25,.5,.75,1].map(t=>t*max);
  const path=k=>rows.map((r,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(r[k]).toFixed(1)).join("");
  const last=rows[n-1];
  return `<div class="legend"><span><i style="background:var(--s1)"></i>Micro-BIC</span><span><i style="background:var(--s2)"></i>Régime réel</span><span><i style="background:var(--s2);height:0;border-top:2px dashed var(--s2)"></i>Réel + impôt à la revente</span></div>
  <div class="chart" id="chartC" data-rows='${esc(JSON.stringify(rows.map(r=>[r.y,Math.round(r.cumM),Math.round(r.cumR)])))}'>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Impôt cumulé micro-BIC contre réel">
   ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end" font-size="17" fill="var(--muted)">${Math.round(t/1000)} k€</text>`).join("")}
   ${rows.map((r,i)=>(i%Math.ceil(n/8)===0||i===n-1)?`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="17" fill="var(--muted)">an ${r.y}</text>`:"").join("")}
   <path d="${path("cumM")}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>
   <path d="${path("cumR")}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round"/>
   <line x1="${x(n-1)}" x2="${x(n-1)}" y1="${y(last.cumR)}" y2="${y(p.totRPV)}" stroke="var(--s2)" stroke-width="2" stroke-dasharray="4 3"/>
   <circle cx="${x(n-1)}" cy="${y(last.cumM)}" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
   <circle cx="${x(n-1)}" cy="${y(p.totRPV)}" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>
   <text x="${x(n-1)+10}" y="${y(last.cumM)+4}" font-size="17" fill="var(--ink)">Micro ${Math.round(last.cumM/100)/10} k€</text>
   <text x="${x(n-1)+10}" y="${y(p.totRPV)+4+(Math.abs(y(p.totRPV)-y(last.cumM))<20?20:0)}" font-size="17" fill="var(--ink)">Réel ${Math.round(p.totRPV/100)/10} k€</text>
   <line id="cx" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" stroke-width="1" opacity="0"/>
   <rect x="${pl}" y="${pt}" width="${W-pl-pr}" height="${H-pt-pb}" fill="transparent" data-hit="1"/>
  </svg><div class="tip" id="ctip"></div></div>`;
}
function impComprendre(){

  <section class="card"><h2>Les deux options</h2>
  <h3>Micro-BIC : le simple</h3><p class="small">Tu déclares le total des loyers encaissés. L'État considère que 50 % sont des charges et t'impose sur l'autre moitié. Aucune comptabilité. Choisi par défaut si tu ne fais rien.</p>
  <h3>Réel : l'optimisé</h3><p class="small">Tu déduis tout ce que tu paies vraiment (intérêts, assurance, taxe foncière, réparations, comptable) <b>plus l'amortissement</b>. Résultat fréquent : 0 € d'impôt pendant 10 à 15 ans. En échange, il faut une comptabilité et une déclaration spéciale (liasse 2031).</p></section>
  <section class="card"><h2>L'amortissement, expliqué simplement</h2><p class="small">Ta maison s'use. Le fisc te permet de considérer chaque année une partie de son prix comme une « charge », même si tu ne sors pas d'argent. Ex. : une maison de 120 000 € (hors terrain) amortie sur 30 ans = 4 000 € de charge en moins chaque année. C'est ce qui rend le réel si puissant.</p>
  <h3>Le piège depuis 2025</h3><p class="small">Quand tu revendras, les amortissements déduits sont ajoutés à ta plus-value : tu paieras plus d'impôt à la vente. Plus tu gardes la maison longtemps, plus ce piège fond (exonération totale d'impôt sur la plus-value après 22 ans, de prélèvements sociaux après 30 ans). Le simulateur en tient compte.</p></section>
  <section class="card"><h2>Les prélèvements sociaux</h2><p class="small">En plus de l'impôt, les bénéfices de location meublée subissent 18,6 % de prélèvements sociaux depuis 2026. Au réel, s'il n'y a pas de bénéfice imposable, il n'y en a pas non plus.</p></section>

function afterRender(anim){
  initPads();
  if(anim&&!matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelectorAll('#main [data-count]').forEach(el=>{const to=N(el.dataset.count),sign=el.dataset.sign;const t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/900);const e=1-Math.pow(1-k,3);const v=to*e;el.textContent=(sign&&v>=0?'+':'')+eur(v);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
  const ch=document.getElementById("chartC");if(!ch)return;
  const rows=JSON.parse(ch.dataset.rows);const svg=ch.querySelector("svg");const tip=ch.querySelector("#ctip");const line=ch.querySelector("#cx");
  const vb=svg.viewBox.baseVal;const pl=70,pr=130;const n=rows.length;
  const move=ev=>{const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)/r.width*vb.width;let i=Math.round((px-pl)/((vb.width-pl-pr)/Math.max(1,n-1)));i=Math.max(0,Math.min(n-1,i));const xx=pl+(n<=1?0:i/(n-1))*(vb.width-pl-pr);
    line.setAttribute("x1",xx);line.setAttribute("x2",xx);line.setAttribute("opacity",".5");tip.style.left=(xx/vb.width*r.width)+"px";tip.style.top="30px";tip.style.opacity=1;
    tip.innerHTML=`Année ${rows[i][0]}<br>Micro : ${eur(rows[i][1])}<br>Réel : ${eur(rows[i][2])}`};
  svg.addEventListener("pointermove",move);svg.addEventListener("pointerleave",()=>{tip.style.opacity=0;line.setAttribute("opacity","0")});
}

function pickFiles(target){
  if(DEMO&&target.kind!=="avis2d"&&target.kind!=="avis"){toast("Pas d'envoi de fichiers en mode démo");return}
  if(!ASSETS&&target.kind!=="avis"&&target.kind!=="avis2d"){toast("L'envoi de fichiers marche dans l'appli publiée");return}
  UI.uploadTarget=target;const inp=$("#filePick");inp.value="";
  inp.accept=(target.kind==="avis"||target.kind==="avis2d")?"image/*,application/pdf":target.kind==="photos"?"image/*,video/*,application/pdf":"image/*,application/pdf";
  inp.multiple=target.kind!=="avis"&&target.kind!=="avis2d";inp.click();
}
$("#filePick").addEventListener("change",async e=>{
  const files=[...e.target.files];const t=UI.uploadTarget;if(!files.length||!t)return;
  if(t.kind==="avis"){lireAvis(files[0]);return}
  if(t.kind==="avis2d"){scanAvisCand(t.id,[files[0]]);return}
  toast("Envoi en cours…");
  for(const file of files){
    try{
      if(file.size>20*1024*1024){toast(file.name+" dépasse 20 Mo");continue}
      const r=await ASSETS.upload(file);
      const meta={id:r.id,url:r.url,nom:file.name,type:r.contentType||file.type,size:r.sizeBytes||file.size};
      if(t.kind==="doc"){const invIt=t.inv?S.inventaire.items.find(x=>x.id===t.inv):null;S.coffre.items.push({id:uid(),assetId:r.id,url:r.url,nom:invIt?"Facture – "+invIt.nom+(file.name.match(/\.[a-z0-9]+$/i)?.[0]||""):file.name,inv:t.inv||"",type:meta.type,size:meta.size,cat:t.cat,key:t.key,date:today(),ent:t.ent||""});touch("coffre")}
      else{const arr=getPath(t.path);if(Array.isArray(arr))arr.push(meta);else setPath(t.path,[meta]);touch(t.path.split(".")[0])}
    }catch(err){toast("Échec de l'envoi : "+(err?.message||"réessaie"))}
  }
  toast("Fichier(s) ajouté(s)");const y=window.scrollY;render();window.scrollTo(0,y);refreshSheet();
  const mj=(t.path||"").match(/^journal\.items\.(\d+)\.photos$/);if(mj){const j=S.journal.items[N(mj[1])];if(j){const arr=j.photos||[];const added=arr.slice(-files.length);added.forEach(ph=>{if(!S.coffre.items.some(d=>d.assetId===ph.id))S.coffre.items.push({id:uid(),assetId:ph.id,url:ph.url,nom:"Facture – "+(j.titre||"à classer")+(String(ph.nom||"").match(/\.[a-z0-9]+$/i)?.[0]||""),type:ph.type,size:ph.size,cat:"travaux",key:"",date:j.date||today(),jour:j.id})});touch("coffre")}}

});

Sa question : ${q}`,{modelTier:"default",onText:({text})=>{UI.aiOut.ask=text;const box=document.querySelector("#main .card.flat");if(box)box.textContent=text}});

}
